kotlin.code.style=official

# Linux native tests cannot run on macOS; skip them there without a warning.
kotlin.native.ignoreDisabledTargets=true

# Build independent modules at the same time; the Linux CI job links the native test
# binaries of the three modules side by side instead of one after the other. The larger
# heap leaves room for two Kotlin/Native links running at once. The Apple CI jobs pass
# --max-workers=1, because their three-core runners link far slower in parallel.
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
