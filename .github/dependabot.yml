# Weekly update proposals for the version catalog (gradle/libs.versions.toml), the
# Gradle wrapper and the GitHub Actions used by the Checks workflow. Every update is
# grouped into one pull request per week, so CI runs once for the whole batch.
version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: gradle
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
