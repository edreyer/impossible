name: Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, JVM/JS/Linux tests, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 26
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          # The toolchain depends only on the Kotlin version, which the version catalog holds,
          # so editing a build script does not force a fresh ~600 MB download.
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Lint
        run: ./gradlew detekt
      - name: Binary compatibility
        # Compares the public API with the committed dumps in each module's api/ folder.
        run: ./gradlew checkKotlinAbi
      - name: Test
        # Apple targets are skipped on Linux; the apple job runs them.
        run: ./gradlew allTests
      - name: Coverage
        run: |
          ./gradlew koverVerify koverHtmlReport
          ./gradlew -q koverLog | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-linux
          path: |
            **/build/reports/
          retention-days: 14

  apple:
    # Linking each module's native test binary takes minutes, so the two Apple targets
    # run as separate jobs at the same time instead of one after the other.
    name: ${{ matrix.name }} tests
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            target: macosArm64
          - name: iOS simulator
            target: iosSimulatorArm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 26
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          # The toolchain depends only on the Kotlin version, which the version catalog holds,
          # so editing a build script does not force a fresh ~600 MB download.
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Test
        run: ./gradlew ${{ matrix.target }}Test
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.target }}
          path: |
            **/build/reports/tests/
          retention-days: 14
