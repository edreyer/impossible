name: Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, JVM/JS/Linux tests, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 26
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts') }}
      - name: Lint
        run: ./gradlew detekt
      - name: Binary compatibility
        # Compares the public API with the committed dumps in each module's api/ folder.
        run: ./gradlew checkKotlinAbi
      - name: Test
        # Apple targets are skipped on Linux; the apple job runs them.
        run: ./gradlew allTests
      - name: Coverage
        run: |
          ./gradlew koverVerify koverHtmlReport
          ./gradlew -q koverLog | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-linux
          path: |
            **/build/reports/
          retention-days: 14

  apple:
    name: macOS and iOS simulator tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 26
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts') }}
      - name: Test
        run: ./gradlew macosArm64Test iosSimulatorArm64Test
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-apple
          path: |
            **/build/reports/tests/
          retention-days: 14
